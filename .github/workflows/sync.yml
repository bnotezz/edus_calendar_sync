name: School Calendar Sync
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим'
        required: true
        default: 'schedule'
        type: choice
        options:
          - schedule
          - holidays

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          
      - name: Install
        run: pip install -r requirements.txt

      - name: 🔐 Smart Auth & Update Secrets
        id: auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HOST: ${{ secrets.SCHOOL_HOST }}
          LOGIN: ${{ secrets.SCHOOL_LOGIN }}
          PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          ACCESS: ${{ secrets.SCHOOL_TOKEN }}
          UUID: ${{ secrets.SCHOOL_USER_UUID }}
          REFRESH: ${{ secrets.SCHOOL_REFRESH_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $ACCESS" "$HOST/api/school/settings/general/")
          
          if [ "$HTTP_STATUS" != "200" ] && [ -n "$REFRESH" ]; then
            echo "🔄 Access token застарів. Робимо Refresh..."
            REF_RESP=$(curl -s -X POST "$HOST/api/user/token-refresh/" -F "refresh=$REFRESH")

            if echo "$REF_RESP" | jq . >/dev/null 2>&1; then
              NEW_ACCESS=$(echo "$REF_RESP" | jq -r '.access')
            else
              echo "❌ Unexpected response on refresh: $REF_RESP"
              exit 1
            fi
            
            if [ "$NEW_ACCESS" != "null" ] && [ -n "$NEW_ACCESS" ]; then
              ACCESS=$NEW_ACCESS
              gh secret set SCHOOL_TOKEN -b"$ACCESS" --repo ${{ github.repository }}
              HTTP_STATUS="200"
              echo "✅ Refresh успішний. Секрет SCHOOL_TOKEN оновлено."
            fi
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Сесія повністю недійсна. Робимо повний логін..."
            LOG_RESP=$(curl -s -X POST "$HOST/api/user/login/" -F "login=$LOGIN" -F "password=$PASSWORD")

            if ! echo "$LOG_RESP" | jq . >/dev/null 2>&1; then
              echo "❌ Unexpected login response: $LOG_RESP"
              exit 1
            fi
            
            ACCESS=$(echo "$LOG_RESP" | jq -r '.access')
            REFRESH=$(echo "$LOG_RESP" | jq -r '.refresh')
            PARENT_UUID=$(echo "$LOG_RESP" | jq -r '.uuid')
            
            if [ "$ACCESS" == "null" ] || [ -z "$ACCESS" ]; then
              echo "❌ Логін не вдався! Відповідь сервера: $LOG_RESP"
              exit 1
            fi
            
            echo "👨‍👩‍👧 Отримано UUID батьків. Шукаємо профіль учня..."
            CHILD_RESP=$(curl -s -X GET "$HOST/api/student/parent-student/$PARENT_UUID/" -H "Authorization: Bearer $ACCESS")
            
            UUID=$(echo "$CHILD_RESP" | jq -r '.[0].user.uuid')
            CHILD_NAME=$(echo "$CHILD_RESP" | jq -r '.[0].user.first_name')
            
            if [ "$UUID" == "null" ] || [ -z "$UUID" ]; then
              echo "❌ Не вдалося знайти профіль учня! Відповідь сервера: $CHILD_RESP"
              exit 1
            fi
            
            echo "👧 Знайдено профіль: $CHILD_NAME ($UUID)"
            
            gh secret set SCHOOL_TOKEN -b"$ACCESS" --repo ${{ github.repository }}
            gh secret set SCHOOL_REFRESH_TOKEN -b"$REFRESH" --repo ${{ github.repository }}
            gh secret set SCHOOL_USER_UUID -b"$UUID" --repo ${{ github.repository }}
            echo "✅ Логін успішний. Секрети SCHOOL_TOKEN, SCHOOL_REFRESH_TOKEN та SCHOOL_USER_UUID оновлено."
          fi

          echo "::add-mask::$ACCESS"
          echo "valid_token=$ACCESS" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$UUID"
          echo "valid_uuid=$UUID" >> "$GITHUB_OUTPUT"
        
      - name: Execute and Monitor
        env:
          SCHOOL_HOST: ${{ secrets.SCHOOL_HOST }}
          SCHOOL_TOKEN: ${{ steps.auth.outputs.valid_token }}
          SCHOOL_USER_UUID: ${{ steps.auth.outputs.valid_uuid }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HC_SCHEDULE_ID: ${{ secrets.HEALTHCHECKS_SCHEDULE_ID }}
          HC_HOLIDAYS_ID: ${{ secrets.HEALTHCHECKS_HOLIDAYS_ID }}
        run: |
          # 1. Визначаємо поточний режим (як у вашій логіці)
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" == "0 5 * * 0" ]; then
              MODE="holidays"
            else
              MODE="schedule"
            fi
          fi
          echo "🚀 Режим роботи воркфлоу: $MODE"

          # 2. Вибираємо відповідний ID для Healthchecks
          if [ "$MODE" == "holidays" ]; then
            HC_ID="$HC_HOLIDAYS_ID"
          else
            HC_ID="$HC_SCHEDULE_ID"
          fi

          # 3. Надсилаємо сигнал старту (якщо ID задано)
          if [ -n "$HC_ID" ]; then
            curl -m 10 --retry 5 "https://hc-ping.com/$HC_ID/start"
          fi

          # 4. Запускаємо Python, логуємо все в файл синхронно через tee (увімкнено -u для небуферизованого виводу)
          # Захоплюємо stdout та stderr. Якщо скрипт впаде, збережемо статус.
          set -o pipefail
          python -u sync.py --mode $MODE 2>&1 | tee output.log
          EXIT_CODE=$?

          # 5. Звітуємо в Healthchecks за результатами виконання
          if [ -n "$HC_ID" ]; then
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Sending success ping..."
              curl -m 10 --retry 5 --data-binary @output.log "https://hc-ping.com/$HC_ID"
            else
              echo "Sending failure ping..."
              curl -m 10 --retry 5 --data-binary @output.log "https://hc-ping.com/$HC_ID/fail"
              exit $EXIT_CODE
            fi
          else
            # Якщо секрети не налаштовані, просто завершуємо з кодом скрипту
            exit $EXIT_CODE
          fi
